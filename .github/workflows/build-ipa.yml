name: build-ipa
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
      - name: Install XcodeGen
        run: |
          brew install xcodegen || true
          xcodegen --version
      - name: Generate project
        run: xcodegen generate
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -project Retools.xcodeproj -scheme Retools -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tail -120
      - name: Package unsigned IPA
        if: success()
        run: |
          set -e
          APP=$(find build -type d -name 'Retools.app' | head -1)
          echo "app=$APP"; test -d "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Retools-unsigned.ipa Payload
          ls -lh Retools-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Retools-unsigned-ipa
          path: out/Retools-unsigned.ipa
          if-no-files-found: error
