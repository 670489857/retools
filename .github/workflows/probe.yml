name: probe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ubuntu ok $(uname -a)"
  mac14:
    runs-on: macos-14
    steps:
      - run: echo "mac14 ok" && sw_vers && xcodebuild -version
  mac26:
    runs-on: macos-26
    steps:
      - run: echo "mac26 ok" && sw_vers && ls /Applications | grep Xcode
